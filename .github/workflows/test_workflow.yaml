name: Tests

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test with pytest
        run: |
          pytest -m "not integration" --cov=fairly tests/

  integration:
    # Runs only on PRs to main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.base_ref == 'main'
    # Hits live repository APIs with real credentials
    env:
      FAIRLY_FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
      FAIRLY_ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      FAIRLY_4TU_TOKEN: ${{ secrets.FOURTU_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Integration tests (live APIs)
        run: |
          pytest -m integration tests/
